<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doctor Tote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f8de4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Doctor Tote – دكتور كيرو</title>
<style>
:root{
  --bg:#f3f9ff;--panel:#e6f2ff;--panel2:#ffffff;--ink:#17375e;--mute:#6a86a6;--line:#d3e5f8;
  --acc:#2f8de4;--acc2:#6c7cf0;--accs:#d8eaff;--sun:#ffc857;--danger:#e0526a;--shadow:0 10px 30px rgba(47,141,228,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1a2b;--panel:#13243a;--panel2:#1a304b;--ink:#e3f0ff;--mute:#86a2c2;--line:#27415f;--acc:#59aef5;--acc2:#8a96f5;--accs:#21405f;--danger:#ff7d93;--shadow:0 10px 30px rgba(0,0,0,.5)}
}
:root[data-theme="dark"]{--bg:#0e1a2b;--panel:#13243a;--panel2:#1a304b;--ink:#e3f0ff;--mute:#86a2c2;--line:#27415f;--acc:#59aef5;--acc2:#8a96f5;--accs:#21405f;--danger:#ff7d93;--shadow:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic","Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.ic{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

#app{height:100%;display:grid;grid-template-columns:250px 300px 1fr}
#side,#list,#ed{min-width:0;min-height:0;display:flex;flex-direction:column}
#side{background:var(--panel);border-inline-end:1px solid var(--line)}
#list{background:var(--panel2);border-inline-end:1px solid var(--line)}
#ed{background:var(--bg);position:relative}

.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.brand .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(47,141,228,.35)}
.brand h1{margin:0;font-size:19px;line-height:1.2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.2px}
.brand small{color:var(--mute);font-size:13px}
.hd{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.hd h2{margin:0;font-size:20px;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:8px 12px;min-height:40px;color:var(--ink);flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{filter:brightness(.98)}
.btn.on{background:var(--accs);box-shadow:inset 0 0 0 1.5px var(--acc)}
.btn.acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%;justify-content:flex-start;margin-top:8px}
.btn[disabled],.ib[disabled]{opacity:.45;pointer-events:none}
.ib{border:0;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--ink);flex:none;padding:0}
.ib.on{background:var(--accs);box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}
.only-s,.only-m{display:none!important}

.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;color:var(--mute);font-size:14px}
.sidebtn{margin:4px 12px 6px;width:calc(100% - 24px)}
.fl{overflow:auto;flex:1;padding:0 8px 16px}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;min-height:44px}
.frow.on{background:var(--accs)}
.frow .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .cnt{color:var(--mute);font-size:13px}
.frow .more{border:0;background:transparent;color:var(--mute);padding:4px 6px;border-radius:8px}
.fic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.foot{padding:10px 16px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.foot button{border:0;background:transparent;color:var(--mute);padding:6px}

.srch{padding:0 14px 8px;position:relative}
.srch input,.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:42px;outline:none}
.srch input:focus,.in:focus{border-color:var(--acc)}
.nl{overflow:auto;flex:1;padding:4px 10px 90px}
.ni{padding:12px 14px;border-radius:14px;cursor:pointer;margin-bottom:6px;border:1px solid transparent}
.ni.on{background:var(--accs);border-color:var(--acc)}
.ni .nt{font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .ns{color:var(--mute);font-size:13.5px;height:1.4em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .nm{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;margin-top:6px}
.empty{margin:auto;text-align:center;color:var(--mute);padding:30px}
.empty .big{width:84px;height:84px;border-radius:26px;margin:0 auto 12px;background:var(--accs);color:var(--acc);display:grid;place-items:center}
.empty.small{padding:30px 10px;margin:0}

/* شريط الأدوات */
.tb{padding:10px 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tb.hide{display:none}
.row1,.row2,.row3{display:flex;align-items:center;gap:6px}
.row1,.row3{flex-wrap:wrap}
.hs{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none;flex:1;min-width:0}
.hs::-webkit-scrollbar{display:none}
.ttl{flex:1;min-width:110px;border:0;background:transparent;font-size:21px;font-weight:700;outline:none;padding:6px 4px;color:var(--ink)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;width:36px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--acc);box-shadow:0 1px 4px rgba(47,141,228,.25)}
.tbtn{border:0;background:var(--bg);border-radius:12px;height:42px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;color:var(--ink)}
.tbtn.on{background:var(--accs);box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc);font-weight:700}
.chip{border:0;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;height:46px;min-width:62px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;font-size:13px;font-variant-numeric:tabular-nums}
.chip.open{box-shadow:inset 0 0 0 2px var(--acc)}
.chip i{display:block;width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px var(--panel2),0 0 0 3px var(--line)}
#opts{display:none;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px}
.pal{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 2px var(--bg);flex:none}
.sw.sm{width:22px;height:22px}
.sw.on{border-color:var(--ink)}
.cc{width:30px;height:30px;border-radius:50%;position:relative;overflow:hidden;flex:none;background:conic-gradient(#ff6b6b,#ffc857,#d9f56b,#4ade80,#38bdf8,#6366f1,#c084fc,#ff6b6b);box-shadow:inset 0 0 0 2px var(--bg)}
.cc input{position:absolute;inset:-8px;width:50px;height:50px;opacity:0;cursor:pointer}
.rg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.rg input[type=range]{width:130px;accent-color:var(--acc)}
.rg b{min-width:40px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.prev{width:52px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;flex:none}
.prev i{display:block;border-radius:50%}
.fonts{display:flex;gap:6px;overflow-x:auto;padding:2px;width:100%;scrollbar-width:none}
.fonts::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:78px;color:var(--ink)}
.fchip span{font-size:18px;line-height:1.5}
.fchip small{font-size:10.5px;color:var(--mute);font-family:system-ui,sans-serif}
.fchip.on{background:var(--accs);box-shadow:inset 0 0 0 1.5px var(--acc)}
.pgs select{min-height:40px;border-radius:12px;border:0;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:0 10px;max-width:210px}
.mut{color:var(--mute);font-size:13px}
.pill{display:none;position:absolute;top:10px;inset-inline-start:10px;z-index:6;background:var(--panel2);box-shadow:var(--shadow);border-radius:16px;padding:5px;gap:4px;align-items:center}
.pill.show{display:flex}
.pill .ib{width:40px;height:40px;box-shadow:none;background:transparent}
.pill .cur{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--mute);font-size:13px}

.scroll{flex:1;overflow:auto;padding:16px 16px 90px;-webkit-overflow-scrolling:touch}
.pages{display:flex;flex-direction:column;gap:20px;align-items:center}
.pages.horizontal{flex-direction:row;gap:0;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pw{width:100%;display:flex;flex-direction:column;align-items:center;flex:none}
.pages.horizontal .pw{scroll-snap-align:center}
.pn{color:var(--mute);font-size:12.5px;margin-top:8px}
.files{max-width:880px;margin:26px auto 0}
.files h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.files h3 span{display:flex;align-items:center;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative;cursor:pointer;min-height:96px}
.fc img{width:100%;height:84px;object-fit:cover;border-radius:10px;background:var(--panel)}
.fc .ico{height:84px;display:grid;place-items:center;border-radius:10px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.5px;font-family:system-ui,sans-serif}
.fc .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc .sm{font-size:12px;color:var(--mute)}
.fc .x{position:absolute;top:6px;inset-inline-start:6px;border:0;background:rgba(23,55,94,.6);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;padding:0}
.drop{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--mute);font-size:14px}

/* ===== الورق ===== */
.paper{--rule:#bcd9f2;--tx:#17375e;position:relative;container-type:inline-size;aspect-ratio:8/11;width:100%;max-width:880px;margin:0 auto;border-radius:10px;box-shadow:var(--shadow);overflow:hidden;background:#fff;flex:none}
.bg{position:absolute;inset:0;pointer-events:none}
.pbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:#fff}
.ld{position:absolute;inset:0;display:grid;place-items:center;color:#6a86a6;font-size:15px;pointer-events:none;text-align:center;padding:20px}
.txt{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;outline:none;resize:none;color:var(--tx);
  font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;font-size:calc(var(--lh)*.5);line-height:var(--lh);
  padding:var(--lh) var(--pr,10cqw) var(--lh) var(--pl,6cqw);overflow:auto}
.cv{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.paper[data-tool="text"] .cv{pointer-events:none}
.paper[data-tool]:not([data-tool="text"]) .cv{touch-action:none;cursor:crosshair}
.paper[data-tool]:not([data-tool="text"]) .txt{pointer-events:none}

.pp-blank,.pp-pdf{--lh:4cqw}
.pp-cream{--lh:4cqw;background:#fff6d9}
.pp-lined{--lh:4cqw}
.pp-lined .bg,.pp-sage .bg{background-image:linear-gradient(to left,transparent 9cqw,#ffb3bd 9cqw,#ffb3bd 9.25cqw,transparent 9.25cqw),linear-gradient(to bottom,transparent calc(4cqw - .16cqw),var(--rule) calc(4cqw - .16cqw));background-size:100% 100%,100% 4cqw;background-repeat:no-repeat,repeat}
.pp-wide{--lh:6cqw}
.pp-wide .bg{background-image:linear-gradient(to bottom,transparent calc(6cqw - .16cqw),var(--rule) calc(6cqw - .16cqw));background-size:100% 6cqw}
.pp-grid{--lh:4cqw}
.pp-grid .bg{background-image:linear-gradient(var(--rule) .14cqw,transparent .14cqw),linear-gradient(90deg,var(--rule) .14cqw,transparent .14cqw);background-size:4cqw 4cqw}
.pp-dots{--lh:4cqw}
.pp-dots .bg,.pp-sky .bg{background-image:radial-gradient(circle,#a7c9e3 .24cqw,transparent .3cqw);background-size:4cqw 4cqw;background-position:2cqw 2cqw}
.pp-mm{--lh:4cqw}
.pp-mm .bg{background-image:linear-gradient(#9fcdf0 .2cqw,transparent .2cqw),linear-gradient(90deg,#9fcdf0 .2cqw,transparent .2cqw),linear-gradient(#cfe6f8 .1cqw,transparent .1cqw),linear-gradient(90deg,#cfe6f8 .1cqw,transparent .1cqw);background-size:10cqw 10cqw,10cqw 10cqw,2cqw 2cqw,2cqw 2cqw}
.pp-cornell{--lh:4cqw;--pl:30cqw}
.pp-cornell .bg{background-image:linear-gradient(to right,transparent 27cqw,#8fc3ea 27cqw,#8fc3ea 27.3cqw,transparent 27.3cqw),linear-gradient(to bottom,transparent calc(100% - 22cqw),#8fc3ea calc(100% - 22cqw),#8fc3ea calc(100% - 21.7cqw),transparent calc(100% - 21.7cqw)),linear-gradient(to bottom,transparent calc(4cqw - .16cqw),var(--rule) calc(4cqw - .16cqw));background-size:100% 100%,100% 100%,100% 4cqw;background-repeat:no-repeat,no-repeat,repeat}
.pp-todo{--lh:5cqw;--pr:15cqw}
.pp-todo .bg{background-image:radial-gradient(circle at calc(100% - 8cqw) 2.5cqw,transparent 1.2cqw,#8fc3ea 1.25cqw,#8fc3ea 1.55cqw,transparent 1.6cqw),linear-gradient(to bottom,transparent calc(5cqw - .16cqw),var(--rule) calc(5cqw - .16cqw));background-size:100% 5cqw,100% 5cqw}
.pp-music{--lh:6cqw}
.pp-music .bg{background-image:linear-gradient(to bottom,transparent 1.9cqw,#8fb7d8 1.9cqw 2.05cqw,transparent 2.05cqw 3.9cqw,#8fb7d8 3.9cqw 4.05cqw,transparent 4.05cqw 5.9cqw,#8fb7d8 5.9cqw 6.05cqw,transparent 6.05cqw 7.9cqw,#8fb7d8 7.9cqw 8.05cqw,transparent 8.05cqw 9.9cqw,#8fb7d8 9.9cqw 10.05cqw,transparent 10.05cqw);background-size:100% 12cqw;background-position:0 4cqw}
.pp-sage{--lh:4cqw;background:#e3f8ee;--rule:#a9dcc6}
.pp-sky{--lh:4cqw;background:#e6f3ff}

/* نوافذ */
.ov{position:fixed;inset:0;background:rgba(20,40,70,.4);display:grid;place-items:center;z-index:60;padding:16px}
.sheet{background:var(--panel2);border-radius:22px;padding:18px;width:min(430px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.sheet.big{width:min(660px,100%)}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet h4{margin:16px 0 4px;font-size:15px}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row .btn{flex:1}
.lb{display:block;margin:10px 0 6px;color:var(--mute);font-size:14px}
.sw-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.pkg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pk{border:0;background:transparent;padding:6px;border-radius:14px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;color:var(--ink)}
.pk.on{background:var(--accs);box-shadow:inset 0 0 0 1.5px var(--acc)}
.pk .paper{box-shadow:0 2px 8px rgba(0,0,0,.14);border-radius:4px}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px;display:block;margin:0 auto}
.trow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.trow .ti{width:34px;height:34px;border-radius:10px;background:var(--accs);color:var(--acc);display:grid;place-items:center;flex:none}
.trow .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tn small{color:var(--mute);margin-inline-start:6px}
.trow .ib{width:36px;height:36px}
.tg{position:relative;width:46px;height:28px;flex:none}
.tg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
.tg i{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:background .15s}
.tg i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tg input:checked+i{background:var(--acc)}
.tg input:checked+i::after{transform:translateX(-18px)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;border:0;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:20px;color:var(--ink)}
.step b{min-width:28px;text-align:center;font-size:18px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;max-width:90vw;text-align:center}
#scrim{display:none}

/* زر المساعد الذكي */
#aiFab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:20px;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(79,110,240,.45);z-index:35;padding:0}
#aiFab:active{transform:scale(.95)}
#aiFab.hide{display:none}
#ai{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:var(--panel2);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;transform:translateX(-108%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
#ai.open{transform:none;visibility:visible}
.ai-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ai-h b{flex:1;font-size:17px;display:flex;align-items:center;gap:8px}
.ai-h b .lg{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center}
.ai-h select{border:0;background:var(--bg);border-radius:10px;padding:8px;min-height:38px}
.ai-h .ib{width:38px;height:38px}
.ai-m{flex:1;overflow:auto;padding:12px 14px}
.msg{margin:8px 0;padding:10px 13px;border-radius:16px;max-width:94%;line-height:1.75;font-size:15px;word-break:break-word}
.msg.u{background:var(--accs);margin-inline-start:auto;border-end-end-radius:4px}
.msg.a{background:var(--bg);border-end-start-radius:4px}
.msg .li{padding-inline-start:4px}
.msg pre{background:var(--panel);padding:8px;border-radius:10px;overflow:auto;white-space:pre-wrap;direction:ltr;text-align:left;margin:6px 0;font-size:13px}
.msg code{background:var(--panel);padding:1px 5px;border-radius:6px;font-size:13px}
.msg .h{display:block;margin-top:6px}
.msg .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg .act button{border:0;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.ai-note{margin:auto;text-align:center;color:var(--mute);padding:20px;line-height:1.8;font-size:14.5px}
.ai-note .big{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center}
.ai-chips{display:flex;gap:6px;overflow-x:auto;padding:6px 14px;scrollbar-width:none}
.ai-chips::-webkit-scrollbar{display:none}
.ai-chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 12px;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.ai-in{padding:8px 14px 14px;border-top:1px solid var(--line)}
.ai-in .ck{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-bottom:8px}
.ai-box{display:flex;gap:8px;align-items:flex-end}
.ai-box textarea{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;min-height:44px;max-height:140px;resize:none;outline:none;line-height:1.5}
.ai-box textarea:focus{border-color:var(--acc)}

/* شاشات أصغر */
@media (max-width:999px){
  #app{grid-template-columns:290px 1fr}
  #side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:290px;z-index:45;transform:translateX(100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  #app.drawer #side{transform:none;box-shadow:var(--shadow)}
  #app.drawer #scrim{display:block;position:fixed;inset:0;background:rgba(20,40,70,.35);z-index:44}

}

}

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ===== النسخة المستقلة: تحميل الملفات + المساعد الذكي بمفتاح المستخدم ===== */
const DEF_MODELS={quick:'claude-haiku-5-5',default:'claude-sonnet-5-5',complex:'claude-opus-5-5'};
const AICFG={_m:null,get(){if(this._m)return this._m;try{return JSON.parse(localStorage.getItem('tote_ai')||'{}')}catch(e){return {}}},set(o){this._m=null;try{localStorage.setItem('tote_ai',JSON.stringify(o))}catch(e){this._m=o}}};
const blobToB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok({type:b.type||'image/jpeg',data:String(r.result).split(',')[1]});r.onerror=no;r.readAsDataURL(b)});
async function standaloneSave({filename,data}){
  const blob=new Blob([data],{type:'application/pdf'}),file=new File([blob],filename,{type:'application/pdf'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return {status:'saved'}}}
  catch(e){if(e&&e.name==='AbortError'){const err=new Error('declined');err.code='declined';throw err}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
  return {status:'saved'};
}
function makeSampler(){
  const cfg=AICFG.get();if(!cfg.key)return null;
  const f=async(msgs,opt)=>{
    opt=opt||{};
    const c=AICFG.get(),models=Object.assign({},DEF_MODELS,c.models||{}),model=models[opt.modelTier||'default']||models.default;
    let system,ms=msgs.slice();
    if(ms.length>1&&ms[0].role==='user'&&ms[1].role==='user')system=ms.shift().content;
    ms=ms.map(m=>({role:m.role,content:m.content}));
    if(opt.images&&opt.images.length){
      const imgs=await Promise.all(opt.images.map(blobToB64)),last=ms[ms.length-1];
      last.content=[...imgs.map(d=>({type:'image',source:{type:'base64',media_type:d.type,data:d.data}})),{type:'text',text:last.content}];
    }
    let res;
    try{
      res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opt.signal,headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(Object.assign({model,max_tokens:4096,stream:true,messages:ms},system?{system}:{}))});
    }catch(e){
      if(e&&e.name==='AbortError')throw Object.assign(new Error('cancelled'),{code:'cancelled',text:''});
      throw Object.assign(new Error('network'),{code:'upstream_error'});
    }
    if(!res.ok){
      let body='';try{body=await res.text()}catch(e){}
      let code='upstream_error';
      if(res.status===401||res.status===403)code='not_granted';
      else if(res.status===429)code='rate_limited';
      else if(res.status===404)code='model_not_found';
      else if(res.status===400&&/credit|balance|billing/i.test(body))code='sampling_disabled';
      else if(res.status===400&&/too long|maximum|too large/i.test(body))code='prompt_too_large';
      throw Object.assign(new Error('http '+res.status),{code});
    }
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='',truncated=false;
    try{
      for(;;){
        const {done,value}=await rd.read();if(done)break;
        buf+=dec.decode(value,{stream:true});
        let i;
        while((i=buf.indexOf('\n'))>=0){
          const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
          if(!line.startsWith('data:'))continue;
          const js=line.slice(5).trim();if(!js||js==='[DONE]')continue;
          let ev;try{ev=JSON.parse(js)}catch(e){continue}
          if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;opt.onText&&opt.onText({text})}
          else if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason==='max_tokens')truncated=true;
          else if(ev.type==='error')throw Object.assign(new Error('stream'),{code:'upstream_error',text});
        }
      }
    }catch(e){
      if(e&&e.name==='AbortError')throw Object.assign(new Error('cancelled'),{code:'cancelled',text});
      if(e&&e.code){if(e.text==null)e.text=text;throw e}
      throw Object.assign(new Error('stream'),{code:'upstream_error',text});
    }
    if(!text)throw Object.assign(new Error('empty'),{code:'empty_completion'});
    return {text,truncated};
  };
  f.limits=async()=>({images:true});
  return f;
}
async function use(name){
  if(name==='downloads')return {save:standaloneSave};
  if(name==='sample')return makeSampler();
  return null;
}
function aiSettings(){
  const c=AICFG.get(),m=Object.assign({},DEF_MODELS,c.models||{});
  modal(`<h3>إعدادات المساعد الذكي</h3>

  <input class="in" id="kKey" type="password" dir="ltr" placeholder="sk-ant-..." value="${esc(c.key||'')}" autocomplete="off">
  <p class="mut" style="margin:8px 0 0;line-height:1.7">المفتاح بيتخزن على هذا الجهاز بس، وكل سؤال بتبعتيه بيتحاسب على حسابك في Anthropic. لا تشاركي التطبيق مع حد وهو فيه مفتاحك.</p>
  <label class="lb">اسم النموذج: سريع</label><input class="in" id="kM1" dir="ltr" value="${esc(m.quick)}">
  <label class="lb">اسم النموذج: متوازن</label><input class="in" id="kM2" dir="ltr" value="${esc(m.default)}">
  <label class="lb">اسم النموذج: متعمّق</label><input class="in" id="kM3" dir="ltr" value="${esc(m.complex)}">
  <div class="row"><button class="btn acc" id="kSave">حفظ</button><button class="btn danger" id="kDel">حذف المفتاح</button></div>`,(b,close)=>{
    const done=async msg=>{AI.sample=undefined;AI.notice='';close();await getSample();if(!AI.sample)AI.notice='لتشغيل المساعد الذكي أضيفي مفتاح API من أيقونة المفتاح فوق.';renderAI();toast(msg,2200)};
    b.querySelector('#kSave').onclick=()=>{const key=b.querySelector('#kKey').value.trim();AICFG.set({key,models:{quick:b.querySelector('#kM1').value.trim()||DEF_MODELS.quick,default:b.querySelector('#kM2').value.trim()||DEF_MODELS.default,complex:b.querySelector('#kM3').value.trim()||DEF_MODELS.complex}});done(key?'تم حفظ الإعدادات':'المفتاح فاضي')};
    b.querySelector('#kDel').onclick=()=>{AICFG.set({});done('تم حذف المفتاح')};
  });
}

    for(let i=1;i<p.length;i++){

  else if(T.shape==='rect'){const c=[[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]]];for(let i=0;i<4;i++)seg(c[i],c[(i+1)%4])}

function paintPaper(ctx,type,W,H){
  const u=W/100,c=PCFG[type]||PCFG.blank,rule=c.rule||'#bcd9f2';
  ctx.save();ctx.fillStyle=c.bg||'#ffffff';ctx.fillRect(0,0,W,H);

  const vl=(x,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()};
  const rows=(step,col,w)=>{for(let y=step;y<H+step;y+=step)hl(y-w/2,col,w)};

  else if(type==='cornell'){rows(4*u,rule,.16*u);vl(27*u,'#8fc3ea',.3*u);hl(H-22*u,'#8fc3ea',.3*u)}
  else if(type==='todo'){rows(5*u,rule,.16*u);ctx.strokeStyle='#8fc3ea';ctx.lineWidth=.3*u;for(let y=2.5*u;y<H;y+=5*u){ctx.beginPath();ctx.arc(W-8*u,y,1.4*u,0,6.2832);ctx.stroke()}}

  ctx.restore();
}
function paintText(ctx,pg,W,st){
  st=st||TEXT_DEF;
  const c=PCFG[pg.paper]||PCFG.blank,u=W/100,lh=c.lh*u,fs=lh*.5*st.fs,pl=(c.pl==null?6:c.pl)*u,pr=(c.pr==null?10:c.pr)*u,maxW=W-pl-pr;

const pdfCache={},urlCache={};
async function pdfDoc(docId){
  if(pdfCache[docId])return pdfCache[docId];
  await loadPdfJs();
  const blob=await DB.get('files','pdf:'+docId);if(!blob)throw new Error('missing pdf');
  const buf=await blob.arrayBuffer();
  const d=await window.pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  return pdfCache[docId]=d;
}
async function pdfBgURL(src){
  const key='bg:'+src.doc+':'+src.idx;
  if(urlCache[key])return urlCache[key];
  let b=await DB.get('files',key);
  if(!b){
    const d=await pdfDoc(src.doc),p=await d.getPage(src.idx+1);
    const v1=p.getViewport({scale:1}),v=p.getViewport({scale:1400/v1.width});
    const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
    await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    b=await canvasBlob(c,'image/jpeg',.88);await DB.put('files',key,b);
  }
  return urlCache[key]=URL.createObjectURL(b);
}
async function importPdf(file,target){

    const docId=uid();await DB.put('files','pdf:'+docId,file);pdfCache[docId]=d;
    const v=(await d.getPage(1)).getViewport({scale:1});

    if(!n){n=newNote(sel.folder==='all'?null:sel.folder);n.title=file.name.replace(/\.pdf$/i,'');n.pages=[];S.notes.push(n)}
    else at=sel.page+1;
    n.docs=n.docs||{};n.docs[docId]={name:file.name,count:d.numPages};
    if(!n.pdfSize)n.pdfSize=[v.width,v.height];
    const aspect=v.width/v.height,pages=[];
    for(let i=0;i<d.numPages;i++)pages.push({id:uid(),paper:'pdf',text:'',strokes:[],aspect,src:{doc:docId,idx:i}});

}

  toast('جارٍ تجهيز الـPDF…',2500);
  try{
    await loadPdfLib();await loadFont(nstyle(n).font);
    const st=nstyle(n);
    const {PDFDocument}=window.PDFLib,out=await PDFDocument.create(),srcDocs={};
    for(const pg of n.pages){
      if(pg.paper==='pdf'&&pg.src){
        let sd=srcDocs[pg.src.doc];
        if(!sd){const blob=await DB.get('files','pdf:'+pg.src.doc);sd=srcDocs[pg.src.doc]=await PDFDocument.load(await blob.arrayBuffer(),{ignoreEncryption:true})}
        const [cp]=await out.copyPages(sd,[pg.src.idx]);const page=out.addPage(cp);const {width,height}=page.getSize();
        if((pg.text||'').trim()||pg.strokes.length){
          const c=await composePage(pg,1600,width/height,{paper:false,pdfBg:false,style:st});
          const img=await out.embedPng(await (await canvasBlob(c,'image/png')).arrayBuffer());
          page.drawImage(img,{x:0,y:0,width,height});
        }
      }else{
        const w=n.pdfSize?n.pdfSize[0]:595.28,h=n.pdfSize?n.pdfSize[1]:w/(pg.aspect||8/11);
        const page=out.addPage([w,h]);
        const c=await composePage(pg,1600,w/h,{paper:true,pdfBg:false,style:st});
        const img=await out.embedPng(await (await canvasBlob(c,'image/png')).arrayBuffer());
        page.drawImage(img,{x:0,y:0,width:w,height:h});
      }
    }
    const bytes=await out.save();
    const name=((n.title||'ملاحظة').replace(/[\\/:*?"<>|]+/g,' ').trim()||'ملاحظة')+'.pdf';
    await dl.save({filename:name,data:bytes});
    toast('تم تجهيز الملف');
  }catch(e){
    if(e&&e.code==='declined')return;
    toast('تعذّر تصدير الـPDF'+(e&&e.code?' ('+e.code+')':''),3600);
  }
}
async function dropDocs(n){
  const used=new Set();S.notes.forEach(x=>{if(x!==n)x.pages.forEach(p=>p.src&&used.add(p.src.doc))});
  for(const [id,d] of Object.entries(n.docs||{})){
    if(used.has(id))continue;DB.del('files','pdf:'+id);
    for(let i=0;i<d.count;i++){DB.del('files','bg:'+id+':'+i);delete urlCache['bg:'+id+':'+i]}
    delete pdfCache[id];
  }
}

function fitPapers(){
  const sc=$('#sc');if(!sc)return;
  const lay=S.settings.layout||'single';
  document.querySelectorAll('#pages .paper').forEach(p=>{
    if(lay==='horizontal'){const asp=parseFloat(p.style.aspectRatio)||8/11;const w=Math.min(sc.clientWidth-32,880,(sc.clientHeight-80)*asp);p.style.width=Math.max(220,w)+'px'}
    else p.style.width='';

function buildPage(n,pg,idx,layout){
  const pw=document.createElement('div');pw.className='pw';
  const paper=document.createElement('div');paper.className='paper pp-'+pg.paper;paper.style.aspectRatio=pg.aspect||8/11;paper.dataset.tool=tool;paper.dataset.pid=pg.id;
  pw.appendChild(paper);
  if(layout!=='single'){const pn=document.createElement('div');pn.className='pn';pn.textContent='صفحة '+(idx+1)+' من '+n.pages.length;pw.appendChild(pn)}
  const it={pw,paper,pg,mounted:false};pw.__it=it;
  let RO2=null;
  it.mount=()=>{
    if(it.mounted)return;it.mounted=true;
    const isPdf=pg.paper==='pdf';
    paper.innerHTML=`<div class="bg"></div>${isPdf?'<img class="pbg" alt="">':''}<textarea class="txt" dir="auto" spellcheck="false" placeholder="اكتب هنا…"></textarea><canvas class="cv"></canvas>${isPdf?'<div class="ld">جارٍ تحميل الصفحة…</div>':''}`;
    const ta=paper.querySelector('.txt'),cv=paper.querySelector('.cv'),ctx=cv.getContext('2d');
    ta.value=pg.text||'';applyTextStyle(ta,n);
    ta.addEventListener('input',()=>{pg.text=ta.value;touch(n)});
    ta.addEventListener('focus',()=>{setActive(idx);closeOpts()});
    if(isPdf){
      (async()=>{
        try{
          const u=await pdfBgURL(pg.src);if(!it.mounted)return;
          const im=paper.querySelector('.pbg');if(!im)return;
          im.onload=()=>{const a=im.naturalWidth/im.naturalHeight;if(a&&Math.abs(a-(pg.aspect||0))>.002){pg.aspect=a;paper.style.aspectRatio=a;save();fitPapers()}const l=paper.querySelector('.ld');if(l)l.remove()};
          im.src=u;
        }catch(e){const l=paper.querySelector('.ld');if(l)l.textContent='تعذّر تحميل صفحة الـPDF. تأكد من الاتصال بالإنترنت لأول مرة.'}
      })();
    }
    const redraw=()=>{ctx.clearRect(0,0,cv.width,cv.height);pg.strokes.forEach(s=>drawStroke(ctx,s,cv.width))};
    RO2=new ResizeObserver(()=>{const r=paper.getBoundingClientRect();if(!r.width)return;const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);redraw();updatePrev()});
    RO2.observe(paper);
    PG[pg.id]={redraw};
    let drawing=false,cur=null,lastP=.5;
    const pos=e=>{const r=cv.getBoundingClientRect();let pr=(e.pointerType==='pen'&&e.pressure>0)?e.pressure:.5;pr=lastP=lastP*.5+pr*.5;return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.width,+pr.toFixed(3)]};
    const pushUndo=()=>{undoStack.push([pg.id,pg.strokes.slice()]);if(undoStack.length>50)undoStack.shift();redoStack=[]};
    const erase=pt=>{const r=TS(tool).size/800/2;const before=pg.strokes.length;pg.strokes=pg.strokes.filter(s=>!strokePts(s).some(q=>Math.hypot(q[0]-pt[0],q[1]-pt[1])<r+s.w/800/2));if(pg.strokes.length!==before)redraw()};
    cv.addEventListener('pointerdown',e=>{
      if(tool==='text')return;
      if(S.settings.penOnly&&e.pointerType==='touch')return;
      const def=toolDef(tool);if(!def)return;
      e.preventDefault();setActive(idx);closeOpts();

      const pt=pos(e),t=TS(tool);
      if(def.base==='er'){erase(pt)}

      else{cur={k:def.base,c:t.color,w:t.size,a:t.op,p:[pt]};pg.strokes.push(cur);redraw()}
    });
    cv.addEventListener('pointermove',e=>{
      if(!drawing)return;e.preventDefault();
      const def=toolDef(tool);if(!def)return;
      const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
      for(const ev of (evs.length?evs:[e])){const pt=pos(ev);if(def.base==='er')erase(pt);else if(cur){if(def.shape)cur.p[1]=pt;else cur.p.push(pt)}}
      if(def.base!=='er')redraw();
    });

    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  };
  it.unmount=()=>{
    if(!it.mounted)return;it.mounted=false;
    if(RO2){RO2.disconnect();RO2=null}
    paper.innerHTML='';delete PG[pg.id];
  };

}
function trackActive(layout){
  const sc=$('#sc'),host=$('#pages');let raf=0;
  const calc=()=>{
    raf=0;let best=0,bd=1e9;
    if(layout==='vertical'){
      const r=sc.getBoundingClientRect(),cy=r.top+Math.min(r.height*.4,260);
      ITEMS.forEach((it,i)=>{const b=it.pw.getBoundingClientRect();const d=cy<b.top?b.top-cy:(cy>b.bottom?cy-b.bottom:0);if(d<bd){bd=d;best=i}});
    }else{
      const r=host.getBoundingClientRect(),cx=r.left+r.width/2;
      ITEMS.forEach((it,i)=>{const b=it.pw.getBoundingClientRect();const d=Math.abs((b.left+b.right)/2-cx);if(d<bd){bd=d;best=i}});
    }
    setActive(best);
  };
  const h=()=>{if(!raf)raf=requestAnimationFrame(calc)};
  (layout==='vertical'?sc:host).addEventListener('scroll',h,{passive:true});
}
function mountPages(n){
  const host=$('#pages'),layout=S.settings.layout||'single';
  host.className='pages '+layout;host.innerHTML='';
  const idxs=layout==='single'?[sel.page]:n.pages.map((_,i)=>i);
  ITEMS=layout==='single'?[]:idxs.map(i=>buildPage(n,n.pages[i],i,layout));
  if(layout==='single'){const it=buildPage(n,n.pages[sel.page],sel.page,'single');host.appendChild(it.pw);it.mount();ITEMS=[];}
  else{
    ITEMS.forEach(it=>host.appendChild(it.pw));
    const io=new IntersectionObserver(es=>es.forEach(e=>{const it=e.target.__it;if(e.isIntersecting)it.mount();else it.unmount()}),{root:layout==='horizontal'?host:$('#sc'),rootMargin:layout==='horizontal'?'0px 100% 0px 100%':'900px 0px 900px 0px'});
    OBS.push(io);ITEMS.forEach(it=>io.observe(it.pw));
    trackActive(layout);
  }
  fitPapers();
  const ro=new ResizeObserver(()=>fitPapers());ro.observe($('#sc'));OBS.push(ro);
  if(layout!=='single'){requestAnimationFrame(()=>{const it=ITEMS[sel.page];if(it)it.pw.scrollIntoView({block:layout==='vertical'?'start':'nearest',inline:'center'})})}
}

    const c=e.target.closest('[data-fid]');if(!c)return;
    const f=n.files.find(x=>x.id===c.dataset.fid);const u=await fileURL(f.id);if(!u)return toast('الملف غير متوفر');

const AI={open:false,busy:false,ctl:null,sample:undefined,imgOK:false,live:null,notice:''};
const AIERR={not_granted:'المفتاح غير صحيح أو غير مفعّل. راجعي الإعدادات من أيقونة المفتاح.',sampling_disabled:'رصيد حسابك في Anthropic غير كافي أو الحساب غير مفعّل للدفع.',model_not_found:'اسم النموذج غير صحيح. عدّليه من إعدادات المفتاح.',rate_limited:'وصلت لحد الاستخدام أو الطلبات كثيرة. جرّب بعد شوي.',session_expired:'انتهت الجلسة، سجّل دخولك من جديد.',prompt_too_large:'الملاحظة طويلة جدًا. عطّل «استخدم نص هذه الملاحظة» أو اسأل عن صفحة أقصر.',refused:'ما قدر Claude يجاوب على هذا الطلب. غيّر صياغته.',empty_completion:'ما وصل رد. جرّب صياغة ثانية.',upstream_error:'حصل انقطاع في الاتصال. جرّب مرة ثانية.',image_rejected:'الصورة ما انقبلت.',images_unavailable:'إرسال الصور غير متاح هنا.'};
const QUICK=[['fileText','لخّص الملاحظة','لخّص محتوى الملاحظة في نقاط قصيرة.'],['help','أسئلة مراجعة','اكتب 5 أسئلة مراجعة مع إجاباتها المختصرة من محتوى الملاحظة.'],['spell','صحّح الصياغة','صحّح الإملاء والصياغة في نص الصفحة الحالية وأعد كتابته كاملًا.'],['languages','ترجم للإنجليزية','ترجم نص الصفحة الحالية إلى الإنجليزية.'],['list','حوّلها لخطة','حوّل محتوى الملاحظة إلى خطة عمل منظمة بخطوات واضحة.'],['bulb','اشرح ببساطة','اشرح محتوى الملاحظة بأسلوب مبسط مع مثال.']];
async function getSample(){
  if(AI.sample!==undefined)return AI.sample;
  AI.sample=await use('sample');
  if(AI.sample){try{const l=AI.sample.limits?await AI.sample.limits():null;AI.imgOK=!!(l&&l.images)}catch(e){}}
  return AI.sample;
}
function md(s){
  return String(s).split('```').map((part,i)=>{
    if(i%2)return `<pre>${esc(part.replace(/^\w*\n/,''))}</pre>`;
    let h=esc(part);
    h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b class="h">$1</b>').replace(/^\s*[-*•]\s+(.+)$/gm,'<div class="li">• $1</div>');
    return h.replace(/<\/(div|b)>\n/g,m=>m.trim()).replace(/\n/g,'<br>');
  }).join('');
}
function plain(s){return String(s).replace(/```\w*\n?/g,'').replace(/\*\*/g,'').replace(/^#{1,4}\s*/gm,'').replace(/`/g,'')}
async function openAI(){
  AI.open=true;$('#ai').classList.add('open');$('#ai').setAttribute('aria-hidden','false');$('#aiFab').classList.add('hide');renderAI();
  const s=await getSample();
  if(!s)AI.notice='لتشغيل المساعد الذكي أضيفي مفتاح API من أيقونة المفتاح فوق.';
  renderAI();
}
function closeAI(){AI.open=false;$('#ai').classList.remove('open');$('#ai').setAttribute('aria-hidden','true');$('#aiFab').classList.remove('hide')}
function renderAI(){
  const n=curNote(),box=$('#aiMsgs');if(!box)return;
  const chat=(n&&n.chat)||[];
  let h='';
  if(!n)h='<div class="ai-note">اختر ملاحظة أولًا.</div>';
  else if(AI.notice&&!AI.sample)h=`<div class="ai-note"><div class="big">${ic('sparkles',30)}</div>${esc(AI.notice)}<br><br><button class="btn acc" data-cfg="1">${ic('key',17)} إعداد المفتاح</button></div>`;
  else if(!chat.length&&!AI.busy)h=`<div class="ai-note"><div class="big">${ic('sparkles',30)}</div>اسألني عن ملاحظتك: تلخيص، أسئلة مراجعة، تصحيح، ترجمة، أو أي فكرة.<br>الإجابة تنزل لك وتقدر تضيفها للصفحة بضغطة.</div>`;
  chat.forEach((m,i)=>{
    h+=`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?(m.img?ic('image',15)+' ':'')+esc(m.content).replace(/\n/g,'<br>'):md(m.content)}${m.role==='assistant'?`<div class="act"><button data-ai="copy" data-i="${i}">${ic('copy',14)} نسخ</button><button data-ai="add" data-i="${i}">${ic('plus',14)} أضف للصفحة</button><button data-ai="newp" data-i="${i}">${ic('filePlus',14)} صفحة جديدة</button></div>`:''}</div>`;
  });
  if(AI.busy)h+=`<div class="msg a" id="aiLive">${AI.live?md(AI.live):'جارٍ التفكير…'}</div>`;
  box.innerHTML=h;box.scrollTop=box.scrollHeight;
  $('#aiChips').innerHTML=(AI.sample?QUICK.map(([i,l,p])=>`<button data-q="${esc(p)}">${ic(i,15)} ${l}</button>`).join('')+(AI.imgOK?`<button data-q="__img">${ic('image',15)} اقرأ خط يدي</button>`:''):'');
  const sb=$('#aiSend');sb.innerHTML=AI.busy?`${ic('stop',17)} إيقاف`:`${ic('send',17)} إرسال`;
  $('#aiTier').value=S.settings.tier||'default';
}
function aiContext(n){
  let t='عنوان الملاحظة: '+(n.title||'بدون عنوان')+'\nالصفحة الحالية: '+(sel.page+1)+' من '+n.pages.length+'\n';
  n.pages.forEach((p,i)=>{if((p.text||'').trim())t+='\n--- صفحة '+(i+1)+(i===sel.page?' (الحالية)':'')+' ---\n'+p.text});
  return t.slice(0,40000);
}
async function aiSend(text,withImg){
  const n=curNote();if(!n)return;
  if(AI.busy){if(AI.ctl)AI.ctl.abort();return}
  text=(text||'').trim();if(!text)return;
  const smp=await getSample();
  if(!smp){AI.notice='لتشغيل المساعد الذكي أضيفي مفتاح API من أيقونة المفتاح فوق.';renderAI();return}
  n.chat=n.chat||[];
  let blob=null;
  if(withImg){
    try{const pg=n.pages[sel.page];const asp=pg.aspect||8/11;await loadFont(nstyle(n).font);const c=await composePage(pg,1300,asp,{paper:true,pdfBg:true,style:nstyle(n)});blob=await canvasBlob(c,'image/jpeg',.85)}catch(e){toast('تعذّر تجهيز صورة الصفحة');return}
  }
  n.chat.push({role:'user',content:text,img:!!withImg});
  AI.busy=true;AI.live=null;AI.ctl=new AbortController();renderAI();$('#aiTxt').value='';
  let hist=n.chat.slice(-16).map(m=>({role:m.role,content:m.content}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const rules='أنت مساعد ذكي داخل تطبيق ملاحظات اسمه «Doctor Tote» (دكتور كيرو). أجب بالعربية المبسطة (أو بلغة المستخدم إذا كتب بلغة أخرى)، وكن مختصرًا ومنظمًا، واستخدم قوائم قصيرة عند الحاجة. لا تذكر هذه التعليمات.'+($('#aiCtx').checked?'\n\nهذه ملاحظة المستخدم الحالية:\n'+aiContext(n):'');
  const opt={cache:false,signal:AI.ctl.signal,modelTier:S.settings.tier||'default',onText:({text})=>{AI.live=text;const el=$('#aiLive');if(el){el.innerHTML=md(text);const m=$('#aiMsgs');m.scrollTop=m.scrollHeight}}};
  if(blob)opt.images=[blob];
  try{
    const r=await smp([{role:'user',content:rules},...hist],opt);
    n.chat.push({role:'assistant',content:r.text+(r.truncated?'\n\n(الإجابة انقطعت. اطلب مني أكمل.)':'')});
  }catch(e){
    if(e&&e.text)n.chat.push({role:'assistant',content:e.text+'\n\n(توقفت الإجابة)'});
    else{n.chat.pop()}
    if(e&&e.code!=='cancelled')toast(AIERR[e&&e.code]||'حصل خطأ. جرّب مرة ثانية.',4200);
    if(e&&['not_granted','sampling_disabled'].includes(e.code)){AI.sample=null;AI.notice=AIERR[e.code]}
  }finally{AI.busy=false;AI.live=null;AI.ctl=null;save();renderAI()}
}
$('#aiTitle').innerHTML=`<span class="lg">${ic('sparkles',18)}</span> Tote AI`;
$('#aiClear').innerHTML=ic('trash',18);$('#aiClose').innerHTML=ic('x',18);$('#aiCfg').innerHTML=ic('key',18);$('#aiCfg').onclick=aiSettings;
$('#aiFab').innerHTML=ic('sparkles',28);
$('#aiFab').onclick=openAI;
$('#aiClose').onclick=closeAI;
$('#aiClear').onclick=async()=>{const n=curNote();if(n&&(n.chat||[]).length&&await confirmBox('مسح محادثة هذه الملاحظة؟','مسح')){n.chat=[];save();renderAI()}};
$('#aiTier').onchange=e=>{S.settings.tier=e.target.value;save()};
$('#aiSend').onclick=()=>aiSend($('#aiTxt').value);
$('#aiTxt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();aiSend($('#aiTxt').value)}});
$('#aiChips').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const q=b.dataset.q;if(q==='__img')aiSend('اقرأ المكتوب بخط اليد والنص في هذه الصورة (صفحة من ملاحظتي) وحوّله إلى نص مرتب. إذا فيه رسم أو معادلات اشرحها باختصار.',true);else aiSend(q)});
$('#aiMsgs').addEventListener('click',async e=>{
  if(e.target.closest('[data-cfg]')){aiSettings();return}
  const b=e.target.closest('[data-ai]');if(!b)return;
  const n=curNote();if(!n)return;const m=(n.chat||[])[+b.dataset.i];if(!m)return;
  const t=plain(m.content);
  if(b.dataset.ai==='copy'){try{await navigator.clipboard.writeText(t);toast('تم النسخ',1500)}catch(err){toast('تعذّر النسخ',1800)}}
  if(b.dataset.ai==='add'){const pg=n.pages[sel.page];pg.text=(pg.text?pg.text+'\n\n':'')+t;touch(n);renderEditor();toast('أضفتها للصفحة',1800)}
  if(b.dataset.ai==='newp'){const p=newPage(null,n);p.text=t;n.pages.splice(sel.page+1,0,p);sel.page++;touch(n);renderEditor();renderNotes();toast('صفحة جديدة جاهزة',1800)}
});

/* ===== تشغيل ===== */
(async()=>{
  await DB.open();
  S=await DB.get('kv','state');
  if(!S||!S.notes){S=seed();await DB.put('kv','state',S)}
  const d=defSettings();S.settings=Object.assign(d,S.settings||{});
  if(!Array.isArray(S.settings.hidden))S.settings.hidden=DEF_HIDDEN.slice();
  if(!Array.isArray(S.settings.custom))S.settings.custom=[];
  S.notes.forEach(n=>{n.chat=n.chat||[];n.pages.forEach(p=>{(p.strokes||[]).forEach(s=>{if(s.k==='pen')s.k='ball'})})});
  const first=S.notes.slice().sort((a,b)=>b.updated-a.updated)[0];
  sel.note=first?first.id:null;
  renderSide();renderList();renderEditor();
  setView(window.innerWidth<700?'list':'ed');
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
